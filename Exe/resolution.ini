; Amulets & Armor - window / resolution settings (RESSCALE module)
; This file is read once at startup from the game's working directory.
;
; scale       Integer window scale of the game's native resolution.
;             2 turns the 320x200 game into a 640x400 window.
;             Ignored if width AND height are set below.  Range 1-8.
; width       Explicit window width in pixels  (0 = use scale).
; height      Explicit window height in pixels (0 = use scale).
; fit         How the picture fills the window when sizes differ:
;             fit     = as large as possible, aspect kept, black
;                       borders (recommended; the default)
;             integer = only whole multiples: sharpest possible
;             stretch = fill the window, may distort
; fullscreen  1 = fullscreen.  If width/height are 0, the desktop
;             resolution is used.  Defaulted on: SDL_Flip only gets
;             real hardware double-buffering fullscreen on this game's
;             SDL 1.2 backends, not windowed (measured ~40-47% of frame
;             time otherwise). Explicit width/height below keep that
;             saving from being spent right back on scaling to the
;             full desktop resolution instead.
; aspect      1 = stretch the picture 20% taller, reproducing the
;             4:3 look of a CRT (320x200 was never square pixels).
;             0 = crisp square pixels.
; hotkeys     1 = F11 cycles the window scale in game, Alt+Enter
;             toggles fullscreen.  0 = disable both.

scale=2
fit=fit
width=1280
height=800
fullscreen=1
aspect=0
hotkeys=1
