name: Windows release build

# One-off/manual build for release packaging, not a permanent CI gate --
# see Build/Windows/VC2013/AA/AA.vcxproj (the vendored VS2013 project this
# reuses via msbuild). Triggered by hand from the Actions tab or `gh
# workflow run windows-release-build.yml`.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # <TreatWarningAsError>true</TreatWarningAsError> is baked into the
      # vcxproj as literal item metadata, not a $(Property) reference --
      # /p:TreatWarningAsError=false on the command line has no effect on
      # it (item metadata wins over a global property of the same name).
      # Patch it in this ephemeral checkout only; the committed vcxproj
      # (and any local VS2013 build from it) is untouched. The modern
      # MSVC compiler behind v143 surfaces plenty of new warnings
      # (format-string mismatches, C4091, etc.) on this 30-year-old
      # codebase that VS2013's compiler never flagged for the same
      # lines -- fixing all of those is out of scope for a release build.
      - name: Disable TreatWarningAsError for this CI build
        shell: bash
        run: |
          sed -i 's/<TreatWarningAsError>true<\/TreatWarningAsError>/<TreatWarningAsError>false<\/TreatWarningAsError>/g' \
            Build/Windows/VC2013/AA/AA.vcxproj

      # Build the .sln, not the bare .vcxproj: OutDir in the project is
      # $(SolutionDir)$(Configuration)\, which only resolves correctly
      # with a real solution context. The vendored project targets the
      # VS2013 (v120) toolset, which windows-latest doesn't ship --
      # retarget to whatever's installed (v143, matching VS2022) since
      # the C/C++ actually compiled here is already portable (it also
      # builds fine under GCC/Clang on every other platform this
      # project targets). No WindowsTargetPlatformVersion override
      # needed: AA.vcxproj now force-includes WINPACKFIX.H (see that
      # file's own comment) to keep <windows.h> from ever being parsed
      # under this project's global 1-byte struct packing, which is
      # what broke the newest installed SDK's winnt.h otherwise.
      - name: Build AA.exe (Release|Win32)
        run: >
          msbuild Build/Windows/VC2013/AA/AA.sln
          /p:Configuration=Release
          /p:Platform=Win32
          /p:PlatformToolset=v143

      - name: Locate build output
        shell: bash
        run: |
          find Build/Windows/VC2013 -iname 'AA.exe'

      - uses: actions/upload-artifact@v4
        with:
          name: AA-windows
          path: Build/Windows/VC2013/AA/Release/AA.exe
          if-no-files-found: error
